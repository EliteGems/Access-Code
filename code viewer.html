<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Elite Gems — Access Code</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@300;400;500&display=swap');

  :root{
    --ink: #101012;
    --champagne: #c9a961;
    --porcelain: #f3efe6;
    --porcelain-dim: #a8a49b;
    --hairline: rgba(201,169,97,0.25);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background: var(--ink);
    color: var(--porcelain);
    font-family: 'Jost', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card{
    text-align: center;
    max-width: 340px;
    width: 100%;
  }

  .eyebrow{
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--champagne);
    margin-bottom: 8px;
  }

  h1{
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    margin-bottom: 32px;
  }

  .code-display{
    font-family: 'Jost', sans-serif;
    font-size: 52px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--champagne);
    background: #16161a;
    border: 1px solid var(--hairline);
    padding: 24px 12px;
    margin-bottom: 20px;
    cursor: pointer;
    user-select: all;
  }

  .code-display:active{ background: #1c1c20; }

  .countdown-wrap{
    margin-bottom: 24px;
  }

  .countdown-bar{
    height: 4px;
    background: #16161a;
    border: 1px solid var(--hairline);
    overflow: hidden;
    margin-bottom: 8px;
  }

  .countdown-fill{
    height: 100%;
    background: var(--champagne);
    transition: width 1s linear;
  }

  .countdown-text{
    font-size: 12px;
    color: var(--porcelain-dim);
  }

  .copy-btn{
    width: 100%;
    background: var(--champagne);
    color: var(--ink);
    border: none;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    font-weight: 500;
  }

  .copy-btn.copied{
    background: #16161a;
    color: var(--champagne);
    border: 1px solid var(--champagne);
  }

  .hint{
    margin-top: 20px;
    font-size: 10px;
    color: var(--porcelain-dim);
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Elite Gems &amp; Jewellery</div>
  <h1>Current Access Code</h1>

  <div class="code-display" id="codeDisplay" title="Tap to select">------</div>

  <div class="countdown-wrap">
    <div class="countdown-bar"><div class="countdown-fill" id="countdownFill"></div></div>
    <div class="countdown-text" id="countdownText">Refreshing in 30:00</div>
  </div>

  <button class="copy-btn" id="copyBtn">Copy Code</button>

  <div class="hint">This page is private — bookmark it for yourself only.<br>Do not share this link, only the code shown above.</div>
</div>

<script>
  function sha1(msgBytes) {
    function rotl(n, s) { return (n << s) | (n >>> (32 - s)); }
    let ml = msgBytes.length * 8;
    let withOne = new Uint8Array(((msgBytes.length + 8) >> 6) * 64 + 64);
    withOne.set(msgBytes);
    withOne[msgBytes.length] = 0x80;
    let dv = new DataView(withOne.buffer);
    dv.setUint32(withOne.length - 4, ml >>> 0);
    dv.setUint32(withOne.length - 8, Math.floor(ml / 4294967296));

    let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;

    for (let chunkStart = 0; chunkStart < withOne.length; chunkStart += 64) {
      let w = new Array(80);
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(chunkStart + i * 4);
      for (let i = 16; i < 80; i++) w[i] = rotl(w[i-3] ^ w[i-8] ^ w[i-14] ^ w[i-16], 1);
      let a = h0, b = h1, c = h2, d = h3, e = h4;
      for (let i = 0; i < 80; i++) {
        let f, k;
        if (i < 20) { f = (b & c) | (~b & d); k = 0x5A827999; }
        else if (i < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
        else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
        else { f = b ^ c ^ d; k = 0xCA62C1D6; }
        let temp = (rotl(a, 5) + f + e + k + w[i]) >>> 0;
        e = d; d = c; c = rotl(b, 30); b = a; a = temp;
      }
      h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
    }
    let out = new Uint8Array(20);
    let odv = new DataView(out.buffer);
    odv.setUint32(0, h0); odv.setUint32(4, h1); odv.setUint32(8, h2); odv.setUint32(12, h3); odv.setUint32(16, h4);
    return out;
  }

  function concatBytes(a, b) {
    let out = new Uint8Array(a.length + b.length);
    out.set(a, 0);
    out.set(b, a.length);
    return out;
  }

  function hmacSha1(keyBytes, msgBytes) {
    const blockSize = 64;
    if (keyBytes.length > blockSize) keyBytes = sha1(keyBytes);
    let paddedKey = new Uint8Array(blockSize);
    paddedKey.set(keyBytes);
    let oKeyPad = new Uint8Array(blockSize);
    let iKeyPad = new Uint8Array(blockSize);
    for (let i = 0; i < blockSize; i++) {
      oKeyPad[i] = paddedKey[i] ^ 0x5c;
      iKeyPad[i] = paddedKey[i] ^ 0x36;
    }
    let inner = sha1(concatBytes(iKeyPad, msgBytes));
    return sha1(concatBytes(oKeyPad, inner));
  }

  function base32Decode(b32) {
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
    b32 = b32.replace(/=+$/, '').toUpperCase();
    let bits = '';
    for (let i = 0; i < b32.length; i++) {
      let val = alphabet.indexOf(b32[i]);
      bits += val.toString(2).padStart(5, '0');
    }
    let bytes = [];
    for (let i = 0; i + 8 <= bits.length; i += 8) {
      bytes.push(parseInt(bits.substring(i, i + 8), 2));
    }
    return new Uint8Array(bytes);
  }

  function totp(secretB32, period, digits, forTime) {
    const key = base32Decode(secretB32);
    const counter = Math.floor(forTime / period);
    let counterBytes = new Uint8Array(8);
    let dv = new DataView(counterBytes.buffer);
    dv.setUint32(4, counter >>> 0);
    dv.setUint32(0, Math.floor(counter / 4294967296));
    const hash = hmacSha1(key, counterBytes);
    const offset = hash[hash.length - 1] & 0x0f;
    const code = ((hash[offset] & 0x7f) << 24 | (hash[offset+1] & 0xff) << 16 | (hash[offset+2] & 0xff) << 8 | (hash[offset+3] & 0xff)) % Math.pow(10, digits);
    return String(code).padStart(digits, '0');
  }

  const SECRET = "2QKMQPF76H6ZUIBFRVRZ42UVQZZWDDLC";
  const PERIOD = 600;

  const codeDisplay = document.getElementById('codeDisplay');
  const countdownFill = document.getElementById('countdownFill');
  const countdownText = document.getElementById('countdownText');
  const copyBtn = document.getElementById('copyBtn');

  function formatTime(sec){
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function render(){
    const nowSec = Math.floor(Date.now() / 1000);
    const code = totp(SECRET, PERIOD, 6, nowSec);
    codeDisplay.textContent = code.slice(0,3) + ' ' + code.slice(3);

    const secsIntoWindow = nowSec % PERIOD;
    const secsRemaining = PERIOD - secsIntoWindow;
    const pct = (secsRemaining / PERIOD) * 100;
    countdownFill.style.width = pct + '%';
    countdownText.textContent = 'Refreshing in ' + formatTime(secsRemaining);
  }

  function copyCode(){
    const text = codeDisplay.textContent.replace(/\s/g, '');
    const finish = () => {
      copyBtn.classList.add('copied');
      copyBtn.textContent = 'Copied ✓';
      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyBtn.textContent = 'Copy Code';
      }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(text, finish));
    } else {
      fallbackCopy(text, finish);
    }
  }

  function fallbackCopy(text, cb){
    const temp = document.createElement('textarea');
    temp.value = text;
    temp.style.position = 'fixed';
    temp.style.opacity = '0';
    document.body.appendChild(temp);
    temp.focus();
    temp.select();
    try { document.execCommand('copy'); cb(); } catch(e) {}
    document.body.removeChild(temp);
  }

  copyBtn.addEventListener('click', copyCode);
  codeDisplay.addEventListener('click', copyCode);

  render();
  setInterval(render, 1000);
</script>

</body>
</html>
